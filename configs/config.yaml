# Root configuration. Keys are grouped by subsystem (model, mechanisms, task,
# sim_brain, analysis, train, gates, neural, tiers).

paths:
  data_root: /media/amin/EXTERNAL_USB/SMAF/Research/Representation/Working Memory/data
  stimuli: ./stimuli                      # ImageTokenBank broad training pool
  results: ./results
  feature_cache: ./results/feat_cache

# The 5-arm bio-plausibility ABLATION BATTERY (v6.0, comments.txt 2026-07-08;
# 3 interaction-probe cells added 2026-07-08 per user request):
# S = structure/hierarchy, M = modulation (reflective gate), P = synaptic
# plasticity (Hebbian fast weights, §6.2), T = topographic smoothness
# (§1.2), D = Dale's law soft penalty (§1.3). Model IDs are "M" + 5 binary
# digits in this fixed arm order. All 15 cells trained by BPTT throughout.
# Reference-anchored design (NOT a full 2^5): baseline (M00000), full
# reference (M11111), the 5 knock-one-out-from-full cells, the 5
# add-one-to-baseline cells, and 3 targeted two-arm interaction probes
# (below) added to close specific substrate-entanglement/interaction gaps
# the 12-cell core battery leaves open. Answers per-arm add-one/knock-out
# effects (and their NET, lumped-across-other-arms interaction) on two DVs
# -- task performance and brain alignment -- per comments.txt §2.
cells: [
  M00000,   # baseline: every arm off
  M11111,   # full reference: every arm on
  M01111,   # -S: full minus structure/hierarchy
  M10111,   # -M: full minus modulation
  M11011,   # -P: full minus plasticity
  M11101,   # -T: full minus topography
  M11110,   # -D: full minus Dale's law
  M10000,   # +S: baseline plus structure/hierarchy
  M01000,   # +M: baseline plus modulation
  M00100,   # +P: baseline plus plasticity
  M00010,   # +T: baseline plus topography (All-TNNs "topography without hierarchy" test)
  M00001,   # +D: baseline plus Dale's law
  # Targeted two-arm interaction probes (§2's "substrate entanglement"
  # caveat: T behaves differently on the worker's intrinsic grid (S=1) vs.
  # the imposed flat grid (S=0) -- M00010 alone only tests T on the flat
  # substrate; these probes isolate specific pairwise interactions the
  # 12-cell core battery's lumped lookout/add-one design cannot resolve).
  M10010,   # S+T: topography on its native hierarchical (worker-grid) substrate, isolated from M/P/D
  M00011,   # T+D: spatial smoothness + E/I balance on the flat substrate, isolated from S/M/P
  M10001,   # S+D: anatomical routing (hierarchy) + Dale's law "bio-plausible backbone", isolated from M/P/T
]

# Extended local-learning study (§6.3, §3): the same S/M architecture as
# above, trained by node-perturbation escalating to e-prop instead of BPTT.
# Distinct model_ids (M**L, not M**1) so they never collide with the Core
# P-cells; carries over the checkpoints/logs the old L-knob Core grid
# produced for these S/M combinations before v5.0 retired L from Core.
local_learning_cells: [M00L, M01L, M10L, M11L]

model:
  encoder: resnet18                        # frozen, ImageNet-pretrained
  feature_dim: 512
  task_vec_dim: 10
  task_vec_dim_multitask: 13                # Phase 5 item 5.4: multi-task diet's own extended cue width
                                             # (brainalign_wm.tasks.multitask.C_DIM_MULTITASK) -- separate
                                             # from task_vec_dim, which stays 10 for the Sternberg-only
                                             # pipeline (Phases 0-4 and every test depend on that exact width)
  bottleneck: 64                           # Phase 1 (A2/B2 param-budget fix, comments.txt §5): was 128;
                                            # FrontEnd goes 83,712 -> 37,760 params
  substrate: gru                           # {vanilla|gru}; vanilla is the Stage-1 substrate (§4), GRU is
                                            # Stage 2's -- Core battery below is all GRU, so default stays gru
  recurrent_init_spectral_radius: null      # vanilla substrate only (both VanillaRNNCell and
                                             # VanillaHRLCore's worker+manager); null = the plain
                                             # uniform(-1/sqrt(H), 1/sqrt(H)) draw, whose spectral radius
                                             # measures 0.616 +/- 0.011 at H=128 over five seeds. Exists
                                             # because that radius sets the BPTT gradient budget for every
                                             # tick of the trial, so it must be an explicit, logged variable
                                             # rather than an accident of the default init.
  input_noise_sigma: 0.05
  recurrent_noise_sigma: 0.0                # bio-plausible ablation battery §4.4 "+noise" (Core default: off)
  core_dropout_p: 0.0                       # performance-matched baseline "flat_gru_dropout" (Core default: off)
  flat_units: 128                          # S=0 (flat GRU) hidden width -- from scripts/match_param_budget.py
                                            # at param_budget_target_synapses_gru (74,000): solved H=128 (73,728 syn)
  worker_units: 196                        # S=1 worker population, 14x14 grid
  worker_grid: [14, 14]
  worker_density: 0.10                     # B2 fix: was 0.04 (mean in-degree ~6); now ~14
  manager_units: 24                        # Phase 1: from match_param_budget.py at the gru target given the
                                            # smaller bottleneck/g_dim above (was 64) -- see executor.md for
                                            # why this differs from the illustrative 48 comments.txt sketches:
                                            # 48 under-shoots the 74,000-synapse target by ~17% with this
                                            # worker_grid/density; the solver's 24 lands within 0.4% of S=0's
                                            # 73,728, which is what A2 actually requires (S=0 ~= S=1).
  manager_period: 5                        # manager clock period, SAME for M=0 and M=1 (Phase 4/A4 fix:
                                            # M no longer changes update rate, only the on-tick bias)
  manager_every_tick: false                # Phase 4 item 4.2: true restores the pre-fix every-step manager
                                            # update as an explicit supplementary arm -- never the definition of M
  param_budget_tol: 0.05                   # flat vs. hierarchical core parameter match tolerance
  readout_scale: 1.0                       # neutral in the core design; swept in the oblique sub-experiment
  action_dim: 3                            # {0: fixate/no-response, 1: in-set/yes, 2: not-in-set/no}
  g_dim: 32                                # Phase 1: was 128, a rank-64 signal in a 128-d box
  worker_pool_block: 2                     # spatial mean-pool block size on the 14x14 worker grid -> s_t
  flat_grid: [16, 8]                       # arm T on S=0 (§1.2): imposed layout on the flat_units, product
                                            # must equal flat_units (128 = 16*8; was 16x16=256 pre-Phase-1)
                                            # (All-TNNs "topography without hierarchy" test) -- arbitrary unit
                                            # ordering is fine, the smoothness loss makes the map meaningful
                                            # over training; S=1's worker already has an intrinsic worker_grid.
  dale_ei_split: 0.8                       # arm D (§1.3): fraction of recurrent hidden units treated as
                                            # excitatory (Song et al. 2016 / Balwani 2025's 80/20 split)
  param_budget_target_synapses_vanilla: 25000   # Phase 1 (§5): Stage-1 vanilla-substrate target, Masse 2019 anchor
  param_budget_target_synapses_gru: 74000       # Phase 1 (§5): Stage-2 GRU-substrate target

mechanisms:
  reflection_lambda: 0.9                   # R_t leak rate
  reflection_beta: 1.0                     # gate bias gain
  local_rule: node_perturbation            # local-learning-study default rule; fallback ladder escalates to e-prop
  perturb_sigma: 0.3                       # item 10.2 fix: 0.05 gave a ~0.2% argmax-flip rate at GRU-gate init
                                            # scale (swamped by the natural pre-activation gap) -- no exploration
                                            # signal for node perturbation to correlate with reward at any lr_local.
  elig_decay: 0.9
  lr_local: 0.5                            # item 10.2 fix: 1e-3 was tuned for the old (too-small) perturb_sigma;
                                            # re-tuned jointly with perturb_sigma so the rung-1 gate test (see
                                            # tests/test_local_learning_can_learn.py) actually clears 0.95 in 5k trials.
  hebb_eta_decay: 0.9                      # Knob P (§6.2): Hebb_ij(t) decay
  hebb_eta_hebb: 0.05                      # Knob P: Hebb_ij(t) update rate on x_j(t-1)*h_i(t)
  hebb_clip: 2.0                           # Knob P: Hebb_ij clipped to [-hebb_clip, hebb_clip]
  plastic_gradient_checkpointing: true     # P=1 cells retain three [B,3H,H] Hebbian-trace tensors PER TICK
                                            # (gru_cell.py's PlasticGRUCell), a graph that grows linearly with
                                            # trial length -- exceeds the GPU for the S=1/S=0 plastic cells at
                                            # the curriculum's longest load. true (default) runs those cells'
                                            # recurrence through train.py's `_segment_checkpoint_scan` (~sqrt(T)
                                            # segments of torch.utils.checkpoint) instead of a plain loop -- the
                                            # exact same BPTT gradient (tests/test_plastic_checkpointing.py),
                                            # traded for ~30-40% more wall clock on plastic cells only. No effect
                                            # on P=0 cells either way. false reverts to the plain (pre-fix) loop.

task:                                      # image-Sternberg working-memory task
  loads: [1, 2, 3]
  encode_steps: 15                          # Phase 12.5 NO-GO fallback lever 1 (comments.txt §12.5): vanilla
                                             # S=0 never cleared Gate A in 200k steps (train_loss frozen at
                                             # 0.117 from step 10k on -- vanishing-gradient collapse). Lever 1
                                             # (least distorting: more time to encode, no change to memory
                                             # demand) is tried first, before lure_fraction/load-2-stage/
                                             # maintain_steps. Was 10.
  maintain_steps: 15                        # Phase 12.5 NO-GO fallback lever 4 (comments.txt §12.5): levers 1-3
                                             # (encode_steps, lure_fraction, load-2 stage) all failed to move S=0
                                             # off chance -- consistent with an ungated-tanh vanishing-gradient
                                             # collapse over the full BPTT horizon. Lever 4 shortens that horizon
                                             # directly by cutting the maintain (delay) epoch. Last lever in the
                                             # mandated fallback order. Was 25.
  probe_steps: 10
  lure_fraction: 0.2                        # Phase 12.5 NO-GO fallback lever 2 (comments.txt §12.5): lever 1
                                             # (encode_steps 10->15) did not fix S=0's collapse (still frozen
                                             # train_loss/chance accuracy at 200k steps). Lever 2 lowers the
                                             # ramp/target lure-distractor pressure (curriculum.py's ramp phase
                                             # interpolates 0 -> this value; target phase uses it directly).
                                             # Was 0.3.
  n_categories: 4
  categories: [faces, animals, objects, places]
  identity_catch_fraction: 0.0              # §7.1/§9.4a: fraction of trials replacing the probe with an
                                             # identity-report query (position 1's category). 0.0 in Core;
                                             # 0.12 for the {M000, M111} identity-auxiliary sub-experiment.
  multitask_diet: false                     # Phase 5 (comments.txt §5): "WM-only vs multi-task" Stage-1 diet
                                             # factor (§4). false (Core default) = Sternberg only, zero change
                                             # to any existing pipeline; true = interleave the 6-task NeuroGym
                                             # diet (brainalign_wm/tasks/multitask.py), one task per training
                                             # batch, uniform sampling.
  multitask_max_ticks: 40                    # upper bound on a NeuroGym trial's rollout length (observed
                                             # 1-32 ticks across the diet's 5 tasks); a trial that hasn't
                                             # produced `new_trial`/terminated by then is truncated.
  fixation_steps: 3
  iti_steps: 2
  feedback_steps: 1
  # annealed curriculum: ABSOLUTE-step boundaries (Phase 3, comments.txt
  # §5 item 3.5) -- fractions of total_steps silently change meaning once
  # a run's stopping point varies (train-to-criterion, §3), so the
  # boundary is now a fixed step count. Calibrated to the `full` tier's
  # 150,000-step budget (the old fractions' 0.2/0.6 at that length), so the
  # curriculum SHAPE at the tier that matters is unchanged; a shorter tier
  # (smoke/dev) now spends its whole budget inside warmup/ramp instead of
  # a rescaled version of the same three phases -- that is the point of
  # fixing these in absolute steps rather than proportionally.
  curriculum:
    # Phase 12.2 (F4, comments.txt §9.13): A/B'd against 30,000 (Appendix
    # A, 12.2 RESULT; both S=0 GRU seed 0). Load 1 plateaus by step 4,000,
    # so the last ~26,000 steps of a 30k warmup train a load the model
    # already knows while loads 2/3 sit at chance -- at the nearest
    # matched absolute step (24k vs 26,664) the 8k arm is at load3=0.865
    # against the 30k arm's 0.520 (still 3,336 steps of warmup left), and
    # on the OLD three-load gate the 8k arm confirms at 26,000 steps
    # against the 30k arm's 66,660 (2.6x). Full A/B table: executor.md's
    # Phase 12.2 entry. Do not extrapolate to 4,000 -- untested.
    warmup_steps: 8000    # loads=[1] only, short delay, no lures
    # Phase 12.5 lever 3 (vanilla pilot NO-GO under levers 1-2, executor.md):
    # loads=[1,2] only, full delay, still no lures -- isolates load exposure
    # from the lure ramp, which previously started on day one of `ramp`
    # together with load 3. Width matches warmup_steps (F4: load1 plateaus
    # by step ~4,000, so 8,000 gives the same 2x margin for load 2); untested
    # a priori, first attempt.
    load2_steps: 8000
    ramp_steps: 90000      # loads=[1,2,3], full delay, lure_fraction ramped 0 -> configured value
    # target phase = remaining steps: full distribution (all loads/delay/lures)

nback:                                      # Phase 6 (comments.txt §5, Stage 3 prerequisite): n-back task,
                                             # model-internal only (no brain alignment, §9.1). Reuses
                                             # task.categories -- not duplicated here. 6 variants =
                                             # n_values x features, generated by NBackGenerator(n, feature).
  n_values: [1, 2, 3]
  features: [identity, category]
  sequence_length: 20
  match_fraction: 0.4

# Simulated spiking generator: plants ground-truth representational geometry
# for the pipeline recovery gate, independent of the real NWB adapters.
sim_brain:
  n_sessions: 12
  n_units_per_session: 40
  n_patients: 6
  trials_per_condition: 8
  bin_ms: 50
  base_rate_hz: 5.0
  max_rate_hz: 40.0
  refractory_ms: 2.0
  category_dim: 4
  item_dim: 5
  load_levels: [1, 2, 3]
  persistent_frac: 0.6     # fraction of latent variance in the persistent (vs. dynamic) component
  seed: 0

analysis:
  crossnobis_folds: 4
  n_permutations: 1000
  bootstrap_iters: 1000
  noise_ceiling_splits: 100
  fdr_alpha: 0.05

train:
  bptt_unroll: 200
  optimizer: adam
  lr: 1.0e-3                               # Phase 2 (comments.txt §5 item 2.3): was 3e-4, scaled up for the
                                            # batch_size 16->128 bump below; fall back to 3e-4 if Phase 3's
                                            # smoke run is unstable at this rate
  curriculum: [warmup, load2, ramp, target]
  checkpoint_every: 200                    # steps between checkpoints
  eval_trials_per_load: 200                # Phase 3 (A3, §3 MEASUREMENT): n>=200/load during training;
                                            # CI half-width +/-0.042 at p=0.90, vs. +/-0.093 at the old n=40
  final_eval_trials_per_load: 500          # Phase 3 (A3): n=500 for the final, once-per-run number (+/-0.026 CI)
  eval_every: 2000                         # Phase 12 (F3): ABSOLUTE step count between periodic evaluations.
                                            # Was `max(500, total_steps // 30)`, which made the RESOLUTION of
                                            # `steps_to_criterion` depend on `max_steps` (6,666 at the pilot's
                                            # 200k, 3,333 at a 100k grid) -- and `steps_to_criterion` is a
                                            # reported efficiency DV, so runs with different ceilings were not
                                            # comparable. Same fix, same reason, as Phase 3 item 3.5's switch of
                                            # the curriculum boundaries from fractions to absolute steps.
                                            # Confirmation lag is `consecutive_evals` x this = 6,000 steps.
  eval_batch_size: 200                     # batch width used only for evaluate_accuracy's own trial batches.
                                            # Phase 12: was 8. Every tick of a batch costs the same fixed Python/
                                            # kernel-launch overhead regardless of width, so 8 paid the ~71-tick
                                            # unroll cost 25x per 200-trial load instead of once: measured ~100 s
                                            # per periodic evaluation in the Phase 11 pilot. Trials are generated
                                            # one at a time from the same `master_rng` sequence either way, so the
                                            # ESTIMATOR is unchanged; only the input-noise realisations differ
                                            # (FrontEnd noise is active in eval, by design), i.e. a different
                                            # Monte-Carlo sample of the same quantity, not a different quantity.
  value_loss_weight: 0.5
  entropy_coef: 0.01                       # REINFORCE (L=0, ramp/target phases) entropy bonus; audit fix A1a
  rung_check_frac: 0.5                     # fraction of budget before checking the rung-1 gate (local-learning fallback)
  rung_check_frac_2: 0.75                  # fraction of budget before checking the rung-2 gate -> escalate to e-prop (rung 3)
  batch_size: 128                          # trials per training step, all sharing one drawn load; audit fix A1c.
                                            # Phase 2 (B3): was 16 -- [BASHIVAN24] uses 256; 128 chosen given
                                            # the removed per-tick device syncs make it affordable
  energy_cost_weight: 0.0                  # bio-plausible ablation battery §4.4 "+energy cost" (Core default: off)
  l1_weight_penalty: 0.0                   # performance-matched baseline "flat_gru_l1" (Core default: off)
  topo_loss_weight: 0.0                    # arm T (§1.2): spatial-smoothness penalty on the recurrent
                                            # population's grid layout (off for cells with T=0)
  topo_loss_weight_on: 0.01                # magnitude applied to cells with T=1; starting point, tune during
                                            # the Phase B dev-tier sanity check if training is unstable
  dale_penalty_weight: 0.0                 # arm D (§1.3): soft Dale's-law sign penalty on recurrent weight_hh
                                            # matrices (off for cells with D=0)
  dale_penalty_weight_on: 0.01             # magnitude applied to cells with D=1; starting point, tune during
                                            # the Phase B dev-tier sanity check if training is unstable
  supervision: legacy                      # Phase 7 (comments.txt §5): {legacy|SUP|RL|METARL}. "legacy"
                                            # preserves the exact pre-Phase-7 behavior (signal = ce during
                                            # curriculum warmup, reinforce after) for every already-tested
                                            # Sternberg/multitask cell -- SUP/RL only affect `_run_trial`'s
                                            # signal choice when explicitly selected. METARL is NOT threaded
                                            # through `_run_trial`/`train_one` at all (task cue withheld,
                                            # block-structured rollout over n-back -- see
                                            # `run_metarl_block`/`scripts/run_metarl_analysis.py`).
  metarl_block_size: 20                    # Phase 7 item: K, the number of n-back trials per METARL block
                                            # (comments.txt: "BLOCKS of K=20 with a fixed but unsignalled
                                            # (n, feature)")

# Behavioral gates -- ONE criterion, not two (Phase 3, comments.txt §3): a
# run is "trained" once every load meets its human-derived criterion,
# sustained across `consecutive_evals` consecutive evaluations. From real
# human Sternberg performance in 000469 (the only dataset covering all
# three loads) -- see scripts/human_behavior_gates.py, results/human_behavior.csv.
gates:
  # Phase 12 (§3): the old single graded criterion did two incompatible
  # jobs (behavioural inclusion AND training stop rule) at once. Split:
  #
  # Gate A (§3.1): behavioural matching / inclusion. Load 1 only -- the
  # only load all three Sternberg datasets (000469, 000673, 001187) share
  # -- at the DEDUPLICATED pooled q10 (scripts/human_behavior_gates.py,
  # results/human_behavior.csv; 9.8: 92 unique sessions, not 111 rows --
  # 19 identifiers are shared between 000673 and 001187, an MTL
  # re-release of overlapping recordings; naive pooling gives q10=0.8222,
  # not the correct 0.8344). q10 (not min): the observed minimum is one
  # unlucky 36-45-trial session with a Wilson 95% CI of roughly
  # [0.54, 0.80] and would let a single outlier set the study's inclusion
  # threshold. Does NOT stop training -- see extra_milestones/max_steps
  # below. A run below this is recorded `matched: false` with its final
  # accuracy and Wilson CI, never dropped from the report (9.9/9.10).
  criterion:
    load1: 0.83    # dedup pooled q10 = 0.8344, n=92 sessions
  consecutive_evals: 3     # must hold across 3 consecutive evaluations
  # §3.3 efficiency DVs: milestones tracked ADDITIONALLY to Gate A's own
  # threshold (which is tracked as a milestone automatically from
  # `criterion` above) -- so 0.83 lives in exactly one place. Each entry
  # gets its own independent consecutive-eval counter; reaching one never
  # stops training and a milestone never reached is recorded `null`.
  extra_milestones:
    load3: 0.80    # 000469 (only dataset with load 3) q10 = 0.8000
  # Gate B (§3.2): the equal-duration budget. A single max_steps, fixed
  # for every cell in a stage, set ONCE per stage from that stage's pilot
  # (12.6) -- NOT a per-run stopping rule, because C1-C4 are geometry DVs
  # that keep changing after accuracy saturates, and comparing two cells'
  # geometry at different training durations confounds arm with duration.
  # `ckpt.pt` at max_steps is what every geometry analysis reads.
  # Set 2026-08-02, user-confirmed; see advisor.md's frozen-preregistration
  # amendment "Gate B is set to max_steps: 80000" for the full derivation.
  # Not the vanilla pilot 12.6 names: flat vanilla is NO-GO under all three
  # signals and has no plateau to read. The calibration pair is the GRU one
  # -- FLATGRU_RL_s0 (S=0) and M10000_pilot_s0 (S=1) -- read with a
  # three-evaluation window mean rather than the rule's literal per-eval
  # delta, because a single n=200 eval's Wilson half-width (+/-0.042) is four
  # times the rule's own 0.01 threshold. Floor term 1.2 x 53,328 = 63,994 ->
  # 70,000; plateau term (both arms) -> 80,000; max = 80,000.
  max_steps: 80000
  # n-back (Stage 3, Phase 6/11): from the 2 Kai Miller ECoG patients (CA,
  # CC) with a usable dataglove response signal -- AL has no response
  # channel, UG's is degenerate -- scripts/human_behavior_gates_nback.py,
  # results/human_behavior_nback.csv. n=0 excluded (target-detection
  # control, not a memory comparison); n=3 not run in this dataset.
  nback:
    n1: 0.96    # median patient accuracy 0.9600; pooled 0.9600 [0.923,0.980], n=200 trials, 2 patients
    n2: 0.83    # median patient accuracy 0.8300; pooled 0.8300 [0.772,0.876], n=200 trials, 2 patients

# Neural alignment: Tier A is the pooled 000469 + 000673 dataset.
neural:
  datasets_tierA: ["000469", "000673"]     # picture Sternberg, MTL+MFC, poolable
  datasets_tierB: ["001187"]               # MTL replication (loadable via intervals/WM_trials; not yet wired into any analysis path)
  datasets_tierC: ["000574"]               # verbal WM, different schema (set_letters/set_size/probe_letter) -- needs its own adapter, not yet built
  regions_MTL: [hippocampus, amygdala]
  regions_MFC: [dACC, preSMA, vmPFC]
  min_firing_hz: 0.1         # Daume et al. 2024 (001187) STAR Methods; the only of the 3 source papers with a number, applied uniformly across datasets
  min_session_accuracy: 0.55 # same source/rationale
  bin_ms: 50

# Compute tiers. run_grid.py reads tiers.<tier> and merges it over the defaults.
tiers:                                                          # `steps` is the run length every cell trains for --
                                                                 # `train.py:1540` reads it as `total_steps` and the
                                                                 # loop has no early stop. Gate A is an INCLUSION
                                                                 # criterion, not a stop rule (§3), so confirming it
                                                                 # does not end a run; the older "training stops as
                                                                 # soon as the criterion is confirmed" note described
                                                                 # train-to-criterion behaviour that no longer exists.
                                                                 # For the campaign, `run_grid.py` overrides `steps`
                                                                 # with `gates.max_steps` (Gate B) -- these tier values
                                                                 # govern the other runners and the smoke/dev paths.
  smoke: {steps: 100, scaffold_sleep_s: 0.02}                  # end-to-end pipeline smoke test
  dev:   {steps: 20000, scaffold_sleep_s: 0.05}                 # NOT a results tier -- new-mechanism (topo/dale)
                                                                 # sanity check only: does the loss decrease, no NaNs
  full:  {steps: 150000, scaffold_sleep_s: 0.10}                # the real, resumable results tier (5 seeds); ceiling
                                                                 # for non-converging cells, not everyone's run length
