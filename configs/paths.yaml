#   BRAINALIGN_WM_STIMULI_ROOT
#   BRAINALIGN_WM_RESULTS_ROOT
#   BRAINALIGN_WM_FEATURE_CACHE_ROOT
#   BRAINALIGN_WM_ACTIVITY_LOGS_ROOT
# Set BRAINALIGN_WM_PATHS_CONFIG to select an entirely different paths file.

paths:
